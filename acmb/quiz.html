var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(row * cellSize, col * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes
  //---------------------------------------------------------------------

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

  //---------------------------------------------------------------------
  // QRMode
  //---------------------------------------------------------------------

  var QRMode = {
    MODE_NUMBER :    1 << 0,
    MODE_ALPHA_NUM : 1 << 1,
    MODE_8BIT_BYTE : 1 << 2,
    MODE_KANJI :     1 << 3
  };

  //---------------------------------------------------------------------
  // QRErrorCorrectionLevel
  //---------------------------------------------------------------------

  var QRErrorCorrectionLevel = {
    L : 1,
    M : 0,
    Q : 3,
    H : 2
  };

  //---------------------------------------------------------------------
  // QRMaskPattern
  //---------------------------------------------------------------------

  var QRMaskPattern = {
    PATTERN000 : 0,
    PATTERN001 : 1,
    PATTERN010 : 2,
    PATTERN011 : 3,
    PATTERN100 : 4,
    PATTERN101 : 5,
    PATTERN110 : 6,
    PATTERN111 : 7
  };

  //---------------------------------------------------------------------
  // QRUtil
  //---------------------------------------------------------------------

  var QRUtil = function() {

    var PATTERN_POSITION_TABLE = [
      [],
      [6, 18],
      [6, 22],
      [6, 26],
      [6, 30],
      [6, 34],
      [6, 22, 38],
      [6, 24, 42],

<style>
  :root{
    --red:#E63820; --deep:#A9260F; --ink:#23202A; --soft:#6F6A72; --paper:#FFFFFF; --mist:#F6F3F2; --blush:#FDECEA;
    --a:#E63820; --a-d:#A9260F; --b:#2B2D42; --b-d:#15162A; --c:#F0A92E; --c-d:#B9781A; --ok:#2E9E5B; --ok-d:#1F6E3F;
    --disp:"Bricolage Grotesque",Arial,sans-serif; --body:Figtree,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--body);color:var(--ink);background:var(--mist);min-height:100vh;font-size:17px;line-height:1.5}
  h1,h2,.disp{font-family:var(--disp);letter-spacing:-.01em}
  /* red stage at the top of every screen */
  header{background:var(--red);color:#fff;padding:14px 22px 64px;position:relative;overflow:hidden}
  header::after{content:"";position:absolute;right:-60px;top:-80px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.08)}
  header::before{content:"";position:absolute;left:38%;bottom:-120px;width:200px;height:200px;border-radius:50%;background:rgba(0,0,0,.06)}
  .bar{display:flex;justify-content:space-between;align-items:center;gap:10px;position:relative;z-index:1;max-width:1060px;margin:0 auto}
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--disp);font-weight:800;font-size:22px}
  .brand svg{flex:none}
  .back{color:#fff;text-decoration:none;font-weight:700;font-size:14px;background:rgba(255,255,255,.16);padding:6px 12px;border-radius:999px}
  .meta{font-size:14px;font-weight:700;background:rgba(255,255,255,.16);padding:6px 12px;border-radius:999px}
  main{max-width:1060px;margin:-44px auto 0;padding:0 16px 48px;position:relative;z-index:2}
  .sheet{background:var(--paper);border-radius:22px;padding:26px 22px;box-shadow:0 10px 30px rgba(169,38,15,.12)}
  h1{font-size:34px;line-height:1.1;margin:0 0 8px;font-weight:800}
  h2{font-size:22px;margin:26px 0 10px;font-weight:800}
  .muted{color:var(--soft)}
  .note{font-size:14px;color:var(--soft);margin-top:8px}
  a{color:var(--deep)}
  :focus-visible{outline:3px solid var(--b);outline-offset:3px}
  /* chunky press buttons: the signature element */
  .btn{border:0;border-radius:16px;padding:15px 24px;font:700 18px var(--body);cursor:pointer;background:var(--red);color:#fff;box-shadow:0 6px 0 var(--deep);transform:translateY(0);transition:transform .08s,box-shadow .08s}
  .btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--deep)}
  .btn.ghost{background:#fff;color:var(--ink);box-shadow:0 6px 0 #E3DCDA;border:2px solid #E3DCDA}
  .btn.ghost:active{box-shadow:0 1px 0 #E3DCDA}
  .btn.full{width:100%}
  .btn:disabled{opacity:.45;cursor:default}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  input.t{font:500 19px var(--body);padding:15px 16px;border:2px solid #E3DCDA;border-radius:14px;width:100%;background:#fff}
  input.t:focus{border-color:var(--red);outline:none}
  /* home */
  .hello{font-size:46px;line-height:1.02;margin:4px 0 6px}
  .choice{display:grid;gap:16px;margin:22px 0 4px;grid-template-columns:repeat(3,1fr)}
  .tile{border:0;text-align:left;cursor:pointer;border-radius:20px;padding:20px 18px 22px;color:#fff;font-family:var(--body);min-height:150px;display:flex;flex-direction:column;justify-content:space-between;transition:transform .08s,box-shadow .08s}
  .tile:active{transform:translateY(5px)}
  .tile b{font-family:var(--disp);font-size:24px;line-height:1.1;display:block}
  .tile span{font-size:15px;opacity:.9}
  .tile .ico{font-size:30px;line-height:1}
  .tile.t1{background:var(--a);box-shadow:0 7px 0 var(--a-d)}
  .tile.t2{background:var(--b);box-shadow:0 7px 0 var(--b-d)}
  .tile.t3{background:#fff;color:var(--ink);box-shadow:0 7px 0 #E3DCDA;border:2px solid #E3DCDA}
  /* question */
  .qtop{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .qnum{white-space:nowrap;font-family:var(--disp);font-weight:800;font-size:15px;background:var(--blush);color:var(--deep);padding:6px 12px;border-radius:999px}
  .pts{font-weight:700;color:var(--soft)}
  .progress{display:flex;gap:4px;margin:14px 0 18px}
  .progress i{flex:1;height:8px;border-radius:6px;background:#EEE7E5}
  .progress i.on{background:var(--red)}
  .question{font-family:var(--disp);font-size:27px;font-weight:800;line-height:1.2;margin-bottom:20px}
  .opt{display:flex;align-items:center;gap:14px;border-radius:18px;padding:16px 16px;color:#fff;font:700 18px/1.3 var(--body);margin-bottom:14px;border:0;width:100%;text-align:left;cursor:pointer;transition:transform .08s,box-shadow .08s,opacity .25s}
  .opt:active{transform:translateY(5px)}
  .opt .L{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;flex:none}
  .opt.A{background:var(--a);box-shadow:0 6px 0 var(--a-d)}
  .opt.B{background:var(--b);box-shadow:0 6px 0 var(--b-d)}
  .opt.C{background:var(--c);box-shadow:0 6px 0 var(--c-d);color:#2a1d05}
  .opt.C .L{background:rgba(0,0,0,.12)}
  .opt.dim{opacity:.28}
  .opt.good{box-shadow:0 6px 0 var(--ok-d),0 0 0 4px var(--ok)}
  .opt:disabled{cursor:default}
  .fb{border-radius:18px;padding:16px 18px;font-size:17px;margin:6px 0 16px;animation:pop .3s ease-out}
  .fb.ok{background:#E3F4EA;color:#14532d}.fb.ko{background:var(--blush);color:#6b1406}
  .fb b{display:block;font-family:var(--disp);font-size:24px;margin-bottom:4px}
  @keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
  /* result */
  .score{display:grid;place-items:center;margin:8px auto 14px;width:210px;height:210px;border-radius:50%;background:conic-gradient(var(--red) calc(var(--p)*1%),#EEE7E5 0)}
  .score div{width:168px;height:168px;border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center}
  .score b{font-family:var(--disp);font-size:56px;line-height:1;color:var(--red)}
  .score span{font-size:15px;color:var(--soft)}
  .code{font:800 34px var(--disp);letter-spacing:8px;background:var(--b);color:#fff;border-radius:14px;padding:8px 18px 8px 26px;display:inline-block}
  /* trainer */
  .qrs{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:14px}
  .qr{border-radius:22px;padding:18px;text-align:center;color:#fff}
  .qr.e{background:var(--a);box-shadow:0 7px 0 var(--a-d)} .qr.s{background:var(--b);box-shadow:0 7px 0 var(--b-d)}
  .qr b{font-family:var(--disp);font-size:26px;display:block}
  .qr span{opacity:.85;font-size:15px}
  .qr .box{background:#fff;display:inline-block;padding:14px;border-radius:16px;margin-top:12px}
  .seg{display:inline-flex;background:var(--mist);border-radius:14px;padding:4px;gap:4px}
  .seg button{border:0;border-radius:11px;padding:10px 16px;font:700 16px var(--body);background:transparent;color:var(--soft);cursor:pointer}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.08)}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#ccc;margin-right:6px}
  .dot.on{background:var(--ok);box-shadow:0 0 0 4px rgba(46,158,91,.2)}
  .runners{display:flex;flex-direction:column;gap:10px;margin-top:12px}
  .runner{display:grid;grid-template-columns:48px 1fr 70px 150px;gap:14px;align-items:center;background:var(--mist);border-radius:16px;padding:10px 14px}
  .av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font:800 18px var(--disp)}
  .runner .nm{font-weight:700}
  .track{height:14px;background:#fff;border-radius:8px;overflow:hidden;margin-top:6px}
  .track i{display:block;height:100%;border-radius:8px;background:var(--red);transition:width .6s}
  .runner.done .track i{background:var(--ok)}
  .runner .sc{font:800 28px var(--disp);text-align:center}
  .runner .st{font-size:14px;color:var(--soft)}
  .runner.done .st{color:var(--ok-d);font-weight:700}
  .empty{background:var(--mist);border-radius:16px;padding:22px;text-align:center;color:var(--soft);margin-top:12px}
  table{width:100%;border-collapse:separate;border-spacing:0;margin-top:10px}
  th,td{text-align:left;padding:10px;border-bottom:1px solid #EEE7E5;vertical-align:middle}
  th{font-size:14px;color:var(--soft);font-weight:700}
  td input{font:15px var(--body);padding:9px;border:2px solid #E3DCDA;border-radius:10px;width:100%}
  details summary{cursor:pointer;color:var(--soft);font-weight:700}
  /* podium */
  .podium{display:flex;align-items:flex-end;justify-content:center;gap:14px;margin:22px 0 8px;min-height:300px}
  .step{width:190px;text-align:center}
  .step .av{margin:0 auto 6px;width:58px;height:58px;font-size:24px}
  .step .nm{font-family:var(--disp);font-weight:800;font-size:22px}
  .step .sc2{color:var(--soft);margin-bottom:8px;font-size:15px}

<body>
<header><div class="bar"><a class="back" id="hub" href="index.html">← Espace formation</a><div class="meta" id="meta">Dossier client conforme</div></div></header>
<main><div class="sheet" id="app"></div></main>
<div class="conf" id="conf"></div>

<script>
const Q = [
 {q:"Le recueil des exigences et besoins du client est obligatoire :",o:["Seulement en assurance vie","Avant toute souscription, quelle que soit la branche","Seulement si le client le demande"],a:1,e:"Le recueil des exigences et besoins est obligatoire avant toute souscription, quelle que soit la branche."},
 {q:"Le document d'entrée en relation (DER) se remet :",o:["À la signature du contrat","Dès le premier contact, avant toute proposition","Une fois par an"],a:1,e:"Le DER se remet dès le premier contact, avant toute proposition."},
 {q:"ACMB est agent général et courtier. Pour chaque proposition, le client doit savoir :",o:["Rien de particulier","À quel titre le cabinet intervient","Seulement le nom de l'assureur"],a:1,e:"Le document de conseil indique si le cabinet agit comme agent général ou comme courtier."},
 {q:"Le document de conseil doit être remis :",o:["Avant la signature du contrat","Après la signature","Seulement si le client le demande"],a:0,e:"Le conseil est toujours remis avant la signature, avec l'IPID."},
 {q:"Quelle information ne doit jamais figurer dans le recueil des besoins ?",o:["La profession","L'état de santé","Le budget"],a:1,e:"Aucune information de santé : le questionnaire médical part directement à l'assureur."},
 {q:"Pour un client professionnel, il faut identifier :",o:["Ses bénéficiaires effectifs","Ses fournisseurs","Ses concurrents"],a:0,e:"Les personnes qui détiennent plus de 25 % de la société ou qui la contrôlent."},
 {q:"Vérifier le gel des avoirs d'un client, c'est :",o:["Vérifier qu'il ne figure pas au registre national des gels","Vérifier sa solvabilité","Bloquer son compte bancaire"],a:0,e:"On consulte le registre national des gels (DG Trésor) à l'entrée en relation et avant une souscription, et on garde une trace."},
 {q:"La formation continue obligatoire d'un distributeur d'assurance est d'au moins :",o:["7 heures par an","15 heures par an","15 heures tous les 3 ans"],a:1,e:"Au moins 15 heures par an. Cette journée en compte 7."},
 {q:"Quel nom de fichier respecte la convention du cabinet ?",o:["Scan001.pdf","Dossier complet.pdf","2026-11-19_RECUEIL_DUPONT.pdf"],a:2,e:"Convention ACMB : AAAA-MM-JJ_TYPE_NOM. Une pièce = un fichier."},
 {q:"Une réclamation client doit recevoir une réponse :",o:["Sous 2 mois maximum, après un accusé de réception sous 10 jours ouvrables","Sous 6 mois","Il n'y a pas de délai"],a:0,e:"Accusé de réception sous 10 jours ouvrables, réponse sous 2 mois maximum."},
 {q:"Le recueil des exigences et besoins doit être :",o:["Daté, signé et conservé dans le dossier client","Simplement oral","Envoyé à la compagnie, sans copie au cabinet"],a:0,e:"Daté, signé et conservé : c'est la preuve du devoir de conseil en cas de contrôle ou de litige."},
 {q:"Après la fin de la relation, le dossier client se conserve au moins :",o:["5 ans","1 an","Il n'y a pas d'obligation"],a:0,e:"Au moins 5 ans après la fin de la relation, notamment pour les pièces de connaissance client (LCB-FT)."},
 {q:"Un dossier client complet contient :",o:["DER, recueil, document de conseil, IPID et pièce d'identité","Seulement le contrat signé","Seulement le devis"],a:0,e:"Chaque étape laisse une pièce datée : DER, recueil, conseil et IPID, contrat, pièces d'identité."},
 {q:"Laquelle est une question ouverte ?",o:["« Vous roulez beaucoup ? »","« Comment utilisez-vous votre véhicule au quotidien ? »","« Vous avez un garage ? »"],a:1,e:"Une question ouverte laisse le client raconter : on découvre ce qu'on n'aurait pas pensé à demander."},
 {q:"Un client paie une grosse somme en espèces et refuse de dire d'où elle vient. Le conseiller :",o:["Prévient le client qu'il va le signaler","Alerte le dirigeant du cabinet, sans prévenir le client","Accepte, ce n'est pas son rôle"],a:1,e:"On alerte le dirigeant du cabinet, sans jamais prévenir le client."}
];
const L = ["A","B","C"];
const SELF_HOSTED = /^https?:$/.test(location.protocol) && !/claude/i.test(location.hostname);
const DEFAULT_LINK = SELF_HOSTED ? location.origin + location.pathname : "https://claude.ai/artifact/S3PypetnSa3DwYavwLUCyB";
const app = document.getElementById("app"), meta = document.getElementById("meta");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const label = m => m === "entree" ? "Quiz d'entrée" : "Quiz de sortie";
const count = m => m === "entree" ? 10 : 15;
const fmt = s => Math.floor(s/60) + " min " + String(s%60).padStart(2,"0") + " s";
const norm = s => s.trim().toUpperCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
// short verification code tied to name + quiz + score + time
function code(name, mode, score, secs){
  let h = 2166136261; const str = norm(name) + "|" + mode + "|" + score + "|" + secs + "|acmb26";
  for (const ch of str) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619) >>> 0; }
  const A = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let out = "";
  for (let k = 0; k < 4; k++) { out += A[h % 32]; h = Math.floor(h / 32); }
  return out;
}
const RELAY = "https://ntfy.sh/";
const topicOf = c => "acmb-quiz-" + c;
const URL_SESSION = (() => { let v = (new URLSearchParams(location.search).get("s") || "").replace(/[^A-Za-z0-9]/g, "").slice(0, 12);
  try { if (v) localStorage.setItem("acmb-session", JSON.stringify(v)); else v = JSON.parse(localStorage.getItem("acmb-session")) || ""; } catch(e) {}
  return v; })();
const hubUrl = s => "index.html" + (s ? "?s=" + s : "");
function send(obj){
  if (!P || !P.session) return;
  try { fetch(RELAY + topicOf(P.session), { method: "POST", body: JSON.stringify(obj) }).catch(() => {}); } catch(e) {}
}
function state(extra){
  const total = count(P.mode);
  send(Object.assign({ v: 1, pid: P.pid, name: P.name, mode: P.mode, q: P.i + (P.answered ? 1 : 0), total, score: P.score, done: false, t: Date.now() }, extra || {}));
}
const AVC = ["#E63820","#2B2D42","#F0A92E","#2E9E5B","#7A3E9D","#1F7A8C","#B42A15","#4A4E69"];
function av(name, cls){ let h = 0; for (const ch of norm(name)) h = (h * 31 + ch.charCodeAt(0)) >>> 0; const ini = norm(name).replace(/[^A-Z]/g,"").slice(0,2) || "?"; return `<span class="av ${cls||""}" style="background:${AVC[h % AVC.length]}">${ini}</span>`; }
const store = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};

// ---------------- routing ----------------
function route(){
  const h = location.hash.replace("#","");
  if (h === "entree" || h === "sortie") return player(h);
  if (h === "animateur") return animateur();
  location.replace(hubUrl(URL_SESSION));
}
window.addEventListener("hashchange", route);

function home(){
  meta.textContent = "Dossier client conforme";
  app.innerHTML = `
    <h1 class="hello">On teste vos réflexes conformité&nbsp;?</h1>
    <p class="muted">Formation « Découverte client et dossier client conforme » – ACMB Assurances</p>
    <div class="choice">
      <button class="tile t1" id="h1"><span class="ico">▲</span><span><b>Quiz d'entrée</b><span>10 questions, le matin</span></span></button>
      <button class="tile t2" id="h2"><span class="ico">◆</span><span><b>Quiz de sortie</b><span>15 questions, en fin de journée</span></span></button>
      <button class="tile t3" id="h3"><span class="ico">●</span><span><b>Écran formatrice</b><span>QR codes, suivi en direct et podium</span></span></button>
    </div>`;
  document.getElementById("h1").onclick = () => location.hash = "entree";
  document.getElementById("h2").onclick = () => location.hash = "sortie";
  document.getElementById("h3").onclick = () => location.hash = "animateur";
}

// ---------------- player (phone) ----------------
let P = null;
function player(mode){
  meta.textContent = label(mode);
  const done = store.get("acmb-quiz-" + mode);
  if (done && done.finished && (done.session || "") === URL_SESSION) return result(done);
  P = { mode, name: "", i: 0, score: 0, start: 0, answered: false, session: URL_SESSION, pid: Math.random().toString(36).slice(2, 10) };
  app.innerHTML = `
    <h1>${label(mode)}</h1>
    <p class="muted">${count(mode)} questions, une seule réponse à chaque fois. La correction s'affiche juste après.</p>
    <h2>Votre prénom</h2>
    <input class="t" id="nm" maxlength="20" placeholder="Prénom" autocomplete="off">
    <div style="margin-top:16px"><button class="btn full" id="go">Commencer</button></div>
    <p class="note" id="err"></p>`;
  const nm = document.getElementById("nm");
  document.getElementById("go").onclick = () => {
    if (!nm.value.trim()) { document.getElementById("err").textContent = "Indiquez votre prénom."; return; }
    P.name = nm.value.trim(); P.start = Date.now(); state(); ask();
  };
}

function ask(){
  const list = Q.slice(0, count(P.mode)), q = list[P.i];
  P.answered = false;
  app.innerHTML = `
    <div class="qtop"><span class="qnum">Question ${P.i+1} sur ${list.length}</span><span class="pts">${esc(P.name)}, ${P.score} bonne${P.score>1?"s":""} réponse${P.score>1?"s":""}</span></div>
    <div class="progress">${list.map((_,k)=>`<i class="${k<=P.i?"on":""}"></i>`).join("")}</div>
    <div class="question">${esc(q.q)}</div>
    ${q.o.map((o,k)=>`<button class="opt ${L[k]}" data-k="${k}"><span class="L">${["▲","◆","●"][k]}</span>${esc(o)}</button>`).join("")}
    <div id="fb"></div>`;
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => answer(+b.dataset.k));
  window.scrollTo(0,0);
}

function answer(k){
  if (P.answered) return;
  P.answered = true;
  const list = Q.slice(0, count(P.mode)), q = list[P.i], ok = k === q.a;
  if (ok) P.score++;
  if (P.i < list.length - 1) state();
  app.querySelectorAll(".opt").forEach(b => { const j = +b.dataset.k; b.classList.add(j === q.a ? "good" : "dim"); b.disabled = true; });
  const last = P.i === list.length - 1;
  document.getElementById("fb").innerHTML = `
    <div class="fb ${ok?"ok":"ko"}"><b>${ok?"Bonne réponse !":"Raté : la bonne réponse est " + L[q.a]}</b>${esc(q.e)}</div>
    <button class="btn full" id="nx">${last?"Voir mon résultat":"Question suivante"}</button>`;
  document.getElementById("nx").onclick = () => {
    if (last) {
      const secs = Math.round((Date.now() - P.start) / 1000);
      const r = { finished: true, session: P.session || "", mode: P.mode, name: P.name, score: P.score, total: list.length, secs, code: code(P.name, P.mode, P.score, secs) };
      store.set("acmb-quiz-" + P.mode, r);
      state({ q: list.length, done: true, secs, code: r.code });
      result(r);
    } else { P.i++; ask(); }
  };
  document.getElementById("nx").scrollIntoView({behavior:"smooth", block:"center"});
}

function result(r){
  meta.textContent = label(r.mode) + ", terminé";
  app.innerHTML = `
    <h1>Bravo ${esc(r.name)} !</h1>
    <p class="muted">${label(r.mode)} terminé</p>
    <div style="text-align:center;margin:10px 0 18px">
      <div class="score" style="--p:${Math.round(r.score/r.total*100)}"><div><span><b>${r.score}</b><br>sur ${r.total}</span></div></div>
      <p style="font-size:18px;margin:0 0 16px">en ${fmt(r.secs)}</p>
      <div class="muted" style="margin-bottom:6px">Code de vérification</div>
      <div class="code">${r.code}</div>
    </div>
    <p style="font-size:17px">Votre résultat s\u2019affiche sur l\u2019écran de la formatrice. En cas de souci, montrez-lui cet écran.</p>
    <p class="note">Rejouer effacera ce résultat.</p>
    <a class="btn full" style="display:block;text-align:center;text-decoration:none;margin-bottom:14px" href="${hubUrl(URL_SESSION)}">Retour à l'espace formation</a>
    <button class="btn ghost full" id="again">Rejouer</button>`;
  document.getElementById("again").onclick = () => { store.set("acmb-quiz-" + r.mode, null); player(r.mode); };
}

// ---------------- formatrice ----------------
const newCode = () => { const A_ = "ABCDEFGHJKMNPQRSTUVWXYZ23456789"; let c = ""; for (let k = 0; k < 6; k++) c += A_[Math.floor(Math.random() * A_.length)]; return c; };
let A = { mode: "entree", rows: [], live: {}, session: store.get("acmb-quiz-session") || newCode(), link: SELF_HOSTED ? DEFAULT_LINK : (store.get("acmb-quiz-link") || DEFAULT_LINK) };
store.set("acmb-quiz-session", A.session); store.set("acmb-session", A.session);
let db = null, history = [], ES = null, liveOk = null;

function connect(){
  if (ES) { try { ES.close(); } catch(e) {} }
  liveOk = null;
  try {
    ES = new EventSource(RELAY + topicOf(A.session) + "/sse?since=all");
    ES.onopen = () => { liveOk = true; renderLive(); };
    ES.onerror = () => { liveOk = false; renderLive(); };
    ES.onmessage = ev => {
      try {
        const m = JSON.parse(ev.data); if (m.event !== "message") return;
        const x = JSON.parse(m.message);
        if (!x || x.v !== 1 || typeof x.pid !== "string" || typeof x.name !== "string" || (x.mode !== "entree" && x.mode !== "sortie")) return;
        const cur = A.live[x.pid];
        if (cur && cur.t > x.t) return;
        A.live[x.pid] = { pid: x.pid, name: String(x.name).slice(0, 20), mode: x.mode, q: +x.q || 0, total: +x.total || count(x.mode), score: +x.score || 0, done: !!x.done, secs: x.secs ?? null, code: String(x.code || ""), t: +x.t || 0 };
        renderLive();
      } catch(e) {}
    };
  } catch(e) { liveOk = false; }
}

function animateur(){
  meta.textContent = "Écran formatrice";
  if (!A.rows.length) A.rows = [0,1,2,3].map(() => ({ name: "", score: "", time: "", code: "" }));
  if (!ES) connect();
  app.innerHTML = `
    <h1>Écran formatrice</h1>
    <p class="muted">Projetez ce QR code en début de journée : chaque participant ouvre l'espace formation sur son portable et le garde toute la journée.</p>
    <div class="qrs">
      <div class="qr e"><b>Espace formation ACMB</b><span>Scannez avec l'appareil photo de votre portable</span><br><div class="box" id="qr1"></div></div>
      <div class="qr s" style="text-align:left;display:flex;flex-direction:column;justify-content:center;gap:10px">
        <b>Tout est dans l'espace</b>
        <span>▲ Quiz d'entrée, le matin</span><span>◆ Quiz de sortie, en fin de journée</span><span>● Jeu de rôle et grille d'observation</span><span>★ Mes engagements</span>
      </div>
    </div>
    <div class="row" style="margin-top:18px;justify-content:space-between">
      <p class="note" style="margin:0">Session <b>${A.session}</b>. Réinitialiser crée un nouveau QR code : les participants le rescannent et repartent de zéro.</p>
      <button class="btn ghost" id="ns">Réinitialiser les quiz</button>
    </div>

    <h2>Suivi en direct</h2>
    <div class="row" style="justify-content:space-between">
      <div class="seg"><button class="${A.mode==="entree"?"on":""}" id="me">Quiz d'entrée</button><button class="${A.mode==="sortie"?"on":""}" id="ms">Quiz de sortie</button></div>
      <span class="note" id="lst" style="margin:0"></span>
    </div>
    <div id="live"></div>
    <div class="row" style="margin-top:14px"><button class="btn" id="show">Afficher le classement final</button></div>

    <details style="margin-top:22px"><summary class="muted" style="cursor:pointer">Saisie manuelle (si un portable n'apparaît pas dans le suivi)</summary>
    <p class="note">Recopiez ce qu'affiche le portable : prénom, score, temps (minutes:secondes) et code. Le ✓ confirme que le score n'a pas été modifié.</p>
    <table id="tb"><tr><th>Prénom</th><th style="width:90px">Score</th><th style="width:120px">Temps (m:ss)</th><th style="width:110px">Code</th><th style="width:60px"></th></tr>
    ${A.rows.map((r,k)=>`<tr data-k="${k}"><td><input data-f="name" value="${esc(r.name)}"></td><td><input data-f="score" inputmode="numeric" value="${esc(r.score)}"></td><td><input data-f="time" placeholder="2:14" value="${esc(r.time)}"></td><td><input data-f="code" maxlength="4" style="text-transform:uppercase" value="${esc(r.code)}"></td><td class="chk"></td></tr>`).join("")}</table>
    <div class="row" style="margin-top:10px"><button class="btn ghost" id="add">+ Ajouter une ligne</button></div>
    <p class="note">Adresse utilisée dans le QR code :</p>
    <div class="row"><input class="t" id="lk" value="${esc(A.link)}" style="flex:1;min-width:260px"><button class="btn ghost" id="lkb">Mettre à jour</button></div>
    </details>
    <div id="hist"></div>`;
  drawQR(); renderLive();
  const ns = document.getElementById("ns");
  ns.onclick = () => {
    if (!ns.dataset.armed) { ns.dataset.armed = "1"; ns.textContent = "Confirmer : tout effacer"; ns.classList.remove("ghost"); setTimeout(() => { if (ns.isConnected) { delete ns.dataset.armed; ns.textContent = "Réinitialiser les quiz"; ns.classList.add("ghost"); } }, 4000); return; }
    A.session = newCode(); store.set("acmb-quiz-session", A.session); store.set("acmb-session", A.session);
    A.live = {}; A.rows = []; connect(); animateur();
  };
  document.getElementById("lkb").onclick = () => { A.link = document.getElementById("lk").value.trim() || DEFAULT_LINK; store.set("acmb-quiz-link", A.link); drawQR(); };
  document.getElementById("me").onclick = () => { A.mode = "entree"; animateur(); };
  document.getElementById("ms").onclick = () => { A.mode = "sortie"; animateur(); };
  document.getElementById("add").onclick = () => { A.rows.push({ name:"", score:"", time:"", code:"" }); animateur(); };
  app.querySelectorAll("#tb tr[data-k]").forEach(tr => tr.querySelectorAll("input").forEach(inp => inp.oninput = () => { A.rows[+tr.dataset.k][inp.dataset.f] = inp.value; check(tr); }));
  app.querySelectorAll("#tb tr[data-k]").forEach(check);
  document.getElementById("show").onclick = podium;
  renderHistory();
}

function renderLive(){
  const box = document.getElementById("live"), st = document.getElementById("lst");
  if (!box) return;
  if (st) st.innerHTML = liveOk === true ? '<span class="dot on"></span>Suivi connecté' : liveOk === false ? '<span class="dot"></span>Connexion au suivi…' : "";
  const total = count(A.mode);
  const list = Object.values(A.live).filter(x => x.mode === A.mode).sort((a,b) => b.score - a.score || b.q - a.q || a.name.localeCompare(b.name));
  if (!list.length) { box.innerHTML = `<div class="empty">Les participants apparaissent ici dès qu'ils ont tapé leur prénom.</div>`; return; }
  const doneN = list.filter(x => x.done).length;
  box.innerHTML = `<p class="note">${list.length} participant${list.length>1?"s":""}, ${doneN} terminé${doneN>1?"s":""}</p>
  <div class="runners">${list.map(x => `<div class="runner ${x.done?"done":""}">${av(x.name)}
    <div><div class="nm">${esc(x.name)}</div><div class="track"><i style="width:${Math.min(100, x.q/total*100)}%"></i></div></div>
    <div class="sc" title="Bonnes réponses">${x.score}</div>
    <div class="st">${x.done ? "Terminé en " + fmt(+x.secs) : "Question " + Math.min(x.q+1,total) + " sur " + total}</div></div>`).join("")}</div>`;
}

function secsOf(t){ const m = String(t).trim().match(/^(\d+)[:h' ]?(\d{1,2})?$/); if (!m) return null; return (+m[1]) * 60 + (+(m[2]||0)); }
function verify(r){
  const s = parseInt(r.score,10), secs = secsOf(r.time);
  if (!r.name.trim() || isNaN(s) || secs === null || !r.code.trim()) return null;
  // the phone rounds to the second; accept the displayed minutes:seconds exactly
  return code(r.name, A.mode, s, secs) === r.code.trim().toUpperCase();
}
function check(tr){
  const v = verify(A.rows[+tr.dataset.k]);
  tr.querySelector(".chk").innerHTML = v === null ? "" : (v ? '<span class="ok-tag">✓</span>' : '<span class="ko-tag" title="Le code ne correspond pas">✗</span>');
}

function drawQR(){
  const el = document.getElementById("qr1"); if (!el) return;
  const base = A.link.split("#")[0].split("?")[0].replace(/quiz\.html$/, "");
  const url = base + "?s=" + A.session;
  try { const qr = qrcode(0, "M"); qr.addData(url); qr.make(); el.innerHTML = qr.createSvgTag({ cellSize: 7, margin: 0, scalable: false }); }
  catch(e) { el.innerHTML = `<p class="muted" style="width:220px;word-break:break-all">${esc(url)}</p>`; }
}

function ranked(){
  const live = Object.values(A.live).filter(x => x.mode === A.mode && x.done)
    .map(x => ({ name: x.name, score: x.score, secs: x.secs === null ? null : +x.secs, ok: code(x.name, x.mode, x.score, +x.secs) === x.code }));
  const seen = new Set(live.map(x => norm(x.name)));
  const manual = A.rows.filter(r => r.name.trim() && r.score !== "" && !seen.has(norm(r.name)))
    .map(r => ({ name: r.name.trim(), score: parseInt(r.score,10) || 0, secs: secsOf(r.time), ok: verify(r) }));
  return live.concat(manual)
    .sort((a,b) => b.score - a.score || (a.secs ?? 1e9) - (b.secs ?? 1e9) || a.name.localeCompare(b.name));
}

function confetti(){
  const c = document.getElementById("conf"), col = ["#E63820","#2B2D42","#E9A23B","#ffffff","#B42A15"];
  for (let k=0;k<120;k++){ const i=document.createElement("i"); i.style.left=Math.random()*100+"vw"; i.style.background=col[k%5];
    i.style.animationDuration=(2.5+Math.random()*2.5)+"s"; i.style.animationDelay=(1.8+Math.random()*1.2)+"s"; c.appendChild(i); }
  setTimeout(() => c.innerHTML = "", 8000);
}

function podium(){
  const list = ranked(), total = count(A.mode);
  if (!list.length) { const l = document.getElementById("live"); if (l) l.insertAdjacentHTML("afterbegin", '<p class="ko-tag">Personne n\'a encore terminé ce quiz.</p>'); return; }
  meta.textContent = label(A.mode) + ", classement final";
  const pod = [list[1], list[0], list[2]].map((x,k) => x ? `<div class="step ${["p2","p1","p3"][k]}">${av(x.name)}<div class="nm">${esc(x.name)}</div><div class="sc2">${x.score} sur ${total}${x.secs!==null?", "+fmt(x.secs):""}</div><div class="blk">${[2,1,3][k]}</div></div>` : "").join("");
  app.innerHTML = `
    <h1 style="text-align:center">${label(A.mode)} – classement final</h1>
    <div class="podium">${pod}</div>
    <table><tr><th>Rang</th><th>Participant</th><th>Score</th><th>Réussite</th><th>Temps</th><th>Code</th></tr>
    ${list.map((x,k)=>`<tr><td>${k+1}</td><td>${esc(x.name)}</td><td>${x.score} / ${total}</td><td>${Math.round(x.score/total*100)} %</td><td>${x.secs!==null?fmt(x.secs):"–"}</td><td>${x.ok?'<span class="ok-tag">✓</span>':'<span class="ko-tag">✗</span>'}</td></tr>`).join("")}</table>
    <div class="row" style="margin-top:20px">
      <button class="btn" id="save">Enregistrer les résultats</button>
      <button class="btn ghost" id="copy">Copier</button>
      <button class="btn ghost" id="back">Retour</button>
    </div>
    <p class="note" id="sv"></p>${(() => { const n = Object.values(A.live).filter(x => x.mode === A.mode && !x.done).length; return n ? `<p class="note">${n} participant${n>1?"s n'ont":" n'a"} pas encore terminé : revenez au suivi puis réaffichez le classement.</p>` : ""; })()}`;
  confetti();
  document.getElementById("back").onclick = animateur;
  document.getElementById("copy").onclick = async () => {
    const txt = `${label(A.mode)} – ${new Date().toLocaleDateString("fr-FR")}\n` + list.map((x,k)=>`${k+1}. ${x.name} : ${x.score}/${total}`).join("\n");
    try { await navigator.clipboard.writeText(txt); document.getElementById("sv").textContent = "Résultats copiés."; }
    catch(e){ document.getElementById("sv").textContent = "Copie impossible ici : notez les scores du tableau."; }
  };
  const sb = document.getElementById("save");
  if (!db) { sb.style.display = "none"; document.getElementById("sv").textContent = "Pensez à copier les résultats pour les garder (preuve Qualiopi)."; return; }
  sb.onclick = async () => {
    sb.disabled = true;
    try {
      await db.collection("sessions").add({ mode: A.mode, at: new Date().toISOString(), total, results: list.map(x => ({ name: x.name, score: x.score, secs: x.secs, verified: !!x.ok })) });
      document.getElementById("sv").textContent = "Résultats enregistrés dans l'historique (preuve Qualiopi).";
    } catch(e) { sb.disabled = false; document.getElementById("sv").textContent = "Enregistrement refusé : utilisez « Copier »."; }
  };
}

function renderHistory(){
  const h = document.getElementById("hist");
  if (!h || !db) { if (h) h.innerHTML = ""; return; }
  if (!history.length) { h.innerHTML = `<h2>Historique</h2><p class="muted">Aucune session enregistrée pour l'instant.</p>`; return; }
  const last = m => history.find(s => s.mode === m), e = last("entree"), s = last("sortie");
  let prog = "";
  if (e && s) {
    const nm = [...new Set([...e.results, ...s.results].map(r => r.name))];
    const pc = (ses, n) => { const r = ses.results.find(x => norm(x.name) === norm(n)); return r ? Math.round(r.score / ses.total * 100) : null; };
    prog = `<h2>Progression entrée → sortie</h2><table><tr><th>Participant</th><th>Entrée</th><th>Sortie</th><th>Évolution</th></tr>${nm.map(n => { const a = pc(e,n), b = pc(s,n);
      return `<tr><td>${esc(n)}</td><td>${a===null?"–":a+" %"}</td><td>${b===null?"–":b+" %"}</td><td>${a===null||b===null?"–":(b-a>=0?"+":"")+(b-a)+" pts"}</td></tr>`; }).join("")}</table>`;
  }
  h.innerHTML = prog + `<h2>Sessions enregistrées</h2><table><tr><th>Date</th><th>Quiz</th><th>Résultats</th></tr>${history.map(x => `<tr><td>${new Date(x.at).toLocaleString("fr-FR",{dateStyle:"short",timeStyle:"short"})}</td><td>${x.mode==="entree"?"Entrée":"Sortie"}</td><td>${x.results.map(r=>esc(r.name)+" "+r.score+"/"+x.total).join(" · ")}</td></tr>`).join("")}</table>`;
}

document.getElementById("hub").href = hubUrl(URL_SESSION);
route();

(async () => {
  try {
    if (!window.claude || !window.claude.use) return;
    db = await window.claude.use("db");
    if (!db) return;
    db.collection("sessions").orderBy("at","desc").limit(50).onSnapshot(snap => {
      history = snap.docs.map(d => d.data()).filter(x => x && Array.isArray(x.results));
      if (location.hash === "#animateur") renderHistory();
    }, () => { db = null; });
  } catch(e) { db = null; }
})();
</script>
